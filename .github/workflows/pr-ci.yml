# Build and run the full XCTest suite on every pull request that touches app
# code, and run the Linux Companion contract suite when Companion changes.
# Docs-only PRs skip the macOS runner; manual runs execute both suites.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the suite either succeeded or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Compile/test artifacts remain unsigned. UI smoke testing uses a separate
# ad-hoc-signed Debug simulator build so installing it preserves entitlements.

name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.run_ios }}
      run_companion: ${{ steps.filter.outputs.run_companion }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual run — executing the full iOS suite."
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
            echo "run_companion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "${files}"
          # Fail closed: anything NOT on the docs-only allowlist triggers the
          # full suite (including workflow, project, and config changes).
          non_docs=$(echo "${files}" | grep -vE '^(docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/dependabot\.yml|\.github/FUNDING\.yml|.*\.md)$' || true)
          if [[ -n "${non_docs}" ]]; then
            echo "Non-docs changes detected — running the full suite:"
            echo "${non_docs}"
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change — skipping the macOS runner."
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "${files}" | grep -qE '^(Companion/|\.github/workflows/pr-ci\.yml$)'; then
            echo "Companion or its CI changed — running the Linux contract suite."
            echo "run_companion=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Companion change — skipping the Linux contract suite."
            echo "run_companion=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      TEST_WORKER_COUNT: 1
      UI_SMOKE_DERIVED_DATA_PATH: DerivedData-UI-Smoke
      UI_SMOKE_OUTPUT_PATH: iphone-ui-smoke

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check simulator acceptance configuration
        run: |
          python3 scripts/check-promotion-config
          python3 scripts/check-iphone-ui-smoke

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select reference iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          selection=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              (device["name"], device["udid"])
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17 Pro Max"
          selected = next((phone for phone in phones if phone[0] == preferred), None)
          if selected is None:
              selected = next((phone for phone in phones if " Pro" in phone[0]), None)
          if selected is None and phones:
              selected = phones[0]
          print("\t".join(selected) if selected else "")
          ')
          IFS=$'\t' read -r name udid <<< "${selection}"
          if [[ -z "${name}" || -z "${udid}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${name} (${udid})"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Select adaptive iPad simulator
        id: ipad_sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          ipads = [
              device["name"]
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPad Pro")
          ]
          preferred = [
              "iPad Pro 13-inch (M5)",
              "iPad Pro 13-inch (M4)",
          ]
          selected = next((name for name in preferred if name in ipads), "")
          if not selected:
              selected = next((name for name in ipads if "13-inch" in name), "")
          print(selected if selected else ipads[0] if ipads else "")
          ')
          if [[ -z "${name}" ]]; then
            echo "No available iPad Pro simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using adaptive-layout simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build adaptive iPad layout
        env:
          IPAD_SIMULATOR_NAME: ${{ steps.ipad_sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${IPAD_SIMULATOR_NAME}" \
            -derivedDataPath "DerivedData-iPad" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "iPad build duration: ${duration_seconds}s"
          echo "- Adaptive iPad build: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build signed iPhone UI smoke app
        id: signed_app
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath "${UI_SMOKE_DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=-

          app_path="${UI_SMOKE_DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator/HermesMobile.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "Signed simulator app was not produced at ${app_path}" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          echo "path=${app_path}" >> "$GITHUB_OUTPUT"

      - name: Capture iPhone UI smoke screenshots
        env:
          APP_PATH: ${{ steps.signed_app.outputs.path }}
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p "${UI_SMOKE_OUTPUT_PATH}"

          xcrun simctl boot "${SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          xcrun simctl ui "${SIMULATOR_UDID}" appearance light
          xcrun simctl status_bar "${SIMULATOR_UDID}" override \
            --time 9:41 \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularBars 4
          xcrun simctl install "${SIMULATOR_UDID}" "${APP_PATH}"

          bundle_id=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "${APP_PATH}/Info.plist")

          capture_ui() {
            local language="$1"
            local locale="$2"
            local fixture="$3"
            local filename="$4"
            xcrun simctl terminate "${SIMULATOR_UDID}" "${bundle_id}" \
              2>/dev/null || true
            xcrun simctl launch \
              "${SIMULATOR_UDID}" \
              "${bundle_id}" \
              -AppleLanguages "(${language})" \
              -AppleLocale "${locale}" \
              "${fixture}" | tee -a "${UI_SMOKE_OUTPUT_PATH}/launch.log"
            sleep 4
            xcrun simctl io "${SIMULATOR_UDID}" screenshot \
              "${UI_SMOKE_OUTPUT_PATH}/${filename}"
          }

          capture_ui en en_US --core-chat-lab core-chat-en.png
          capture_ui zh-Hans zh_CN --core-chat-lab core-chat-zh-Hans.png
          capture_ui en en_US --long-chat-lab long-chat.png

          {
            echo "Simulator: ${SIMULATOR_NAME}"
            echo "UDID: ${SIMULATOR_UDID}"
            echo "Bundle: ${bundle_id}"
            echo "Build: signed Debug iphonesimulator"
          } > "${UI_SMOKE_OUTPUT_PATH}/metadata.txt"

      - name: Upload iPhone UI smoke artifact
        uses: actions/upload-artifact@v7
        with:
          name: iphone-ui-smoke
          path: ${{ env.UI_SMOKE_OUTPUT_PATH }}
          if-no-files-found: error

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  companion:
    name: Companion Contract Tests
    needs: changes
    if: needs.changes.outputs.run_companion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.11"
          working-directory: Companion
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --project Companion

      - name: Run Companion contract tests
        run: |
          PYTHONPATH=Companion/src \
            Companion/.venv/bin/python -m unittest discover -s Companion/tests -v

  gate:
    name: CI Gate
    needs: [changes, test, companion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "companion: ${{ needs.companion.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "Gate passed." ;;
            *) echo "Build and Test did not pass — failing the gate." >&2; exit 1 ;;
          esac
          case "${{ needs.companion.result }}" in
            success|skipped) echo "Companion gate passed." ;;
            *) echo "Companion tests did not pass — failing the gate." >&2; exit 1 ;;
          esac
